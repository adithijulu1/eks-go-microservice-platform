name: CI - EKS Go Microservice Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v

      - name: Build binary
        run: go build -o service ./cmd/service

  terraform-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/ dr/ monitoring/

      - name: Terraform Init
        run: cd terraform && terraform init -backend=false

      - name: Terraform Validate
        run: cd terraform && terraform validate

  salt-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate Salt state YAML syntax
        run: |
          python3 - << 'PYEOF'
          import yaml
          import sys

          files = [
              "salt/states/bastion/init.sls",
              "salt/pillar/bastion.sls",
          ]

          for f in files:
              with open(f) as fh:
                  try:
                      yaml.safe_load(fh)
                      print(f"OK: {f}")
                  except yaml.YAMLError as e:
                      print(f"FAILED: {f}\n{e}")
                      sys.exit(1)
          PYEOF

  k8s-manifest-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes manifests
        run: kubeconform -summary k8s/deployment.yaml k8s/service.yaml
